name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        run: mypy

      - name: Test (fake model, no API key, $0)
        run: pytest -q

      - name: Smoke test the CLI
        run: |
          dossier run "Is the CLI wired up?" --fake --out /tmp/runs > /dev/null
          dossier eval --fake --limit 2 --out /tmp/runs

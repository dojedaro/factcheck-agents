name: Replay viewer

# Builds site/data/bundle.json from the committed runs and evals, then publishes site/ to
# GitHub Pages. The viewer only replays saved traces: no API key, no API calls, $0.

on:
  push:
    branches: [main]
    paths: ["site/**", "examples/**", "evals/results/**", "src/factcheck_agents/site_data.py", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Build the data bundle
        run: |
          args=()
          for d in examples/runs/*/; do args+=(--run "$d"); done
          for d in evals/results/*/; do args+=(--eval "$d"); done
          factcheck site "${args[@]}" --out site/data/bundle.json

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
